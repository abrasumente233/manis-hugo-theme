<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    {{ hugo.Generator }} {{ partial "metatitle" . }} {{ partial "metadesc" . }}
    {{ with .Site.Params.FaviconImg }}
    <link rel="shortcut icon" href="{{.}}" />
    {{ end }} {{ partial "style" . }} {{ range .Site.Params.CustomCSS }}
    <link rel="stylesheet" href="{{ . }}" />
    {{ end }}

    <script defer src="/js/dark-mode.js"></script>
    <link disabled id="dark-mode-theme" rel="stylesheet" href="/css/dark.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap"
        rel="stylesheet"
    />
    <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css?family=Fira+Mono|Lato|Raleway"
    />

    {{ if .Site.Params.HighlightJs }}
    <link
        rel="stylesheet"
        href="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.12.0/styles/{{- .Site.Params.HighlightJsStyle -}}.min.css"
    />
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.12.0/highlight.min.js"></script>
    {{ range .Site.Params.HighlightJsLanguages }}
    <script src="//cdnjs.cloudflare.com/ajax/libs/highlight.js/9.4.0/languages/{{- . -}}.min.js"></script>
    {{ end }} {{ end }}
</head>
